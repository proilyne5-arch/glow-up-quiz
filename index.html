<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glow-Up Skin Diagnostic | The Pretty Plan Hub</title>
  <style>
    /* Design global & Palette Crème & Bronze */
    :root {
      --bg-color: #F9F6F0;
      --card-bg: #FFFFFF;
      --text-color: #4A3E3D;
      --accent-color: #C59B70;
      --button-hover: #A87D56;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      max-width: 600px;
      width: 100%;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: center;
    }

    h1, h2 {
      margin-bottom: 15px;
      color: var(--text-color);
    }

    p {
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .quiz-option {
      display: block;
      width: 100%;
      padding: 15px 20px;
      margin-bottom: 12px;
      background-color: var(--bg-color);
      border: 2px solid transparent;
      border-radius: 8px;
      color: var(--text-color);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .quiz-option:hover, .quiz-option:active {
      border-color: var(--accent-color);
      background-color: #FFF;
    }

    /* Section Résultats & Formulaire MailerLite */
    #results-screen {
      display: none;
      pointer-events: auto;
    }

    .ml-embedded {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- QUIZ CONTAINER -->
    <div id="quiz-screen">
      <h2 id="question-title">Chargement...</h2>
      <p id="question-subtitle">Choisissez l'option qui vous correspond le mieux :</p>
      <div id="options-container"></div>
    </div>

    <!-- ECRAN DE RESULTATS & FORMULAIRE MAILERLITE -->
    <div id="results-screen">
      <h2>✨ Votre Bilan Personnalisé est Prêt !</h2>
      <p>Entrez votre e-mail ci-dessous pour débloquer immédiatement votre diagnostic ainsi que votre <strong>Tracker 30 jours au format PDF</strong>.</p>
      
      <!-- REMPLACER LE FORMID CI-DESSOUS PAR LE VOTRE -->
      <div class="ml-embedded" data-form="VOTRE_FORM_ID_ICI"></div>
    </div>
  </div>

  <!-- SCRIPT MAILERLITE -->
  <script>
    (function(w,d,e,u,f,m,n){w['MailerLiteObject']=f;w[f]=w[f]||function(){
    (w[f].q=w[f].q||[]).push(arguments)},w[f].l=1*new Date();m=d.createElement(e),
    n=d.getElementsByTagName(e)[0];m.async=1;m.src=u;n.parentNode.insertBefore(m,n);
    })(window,document,'script','https://assets.mailerlite.com/js/universal.js','ml');
    
    ml('account', 'VOTRE_ACCOUNT_ID_ICI');
  </script>

  <!-- SCRIPT DU QUIZ (Anti-Blocage Mobile) -->
  <script>
    const questions = [
      {
        question: "Quel est votre objectif principal pour votre peau ?",
        options: ["Hydrater & Apaiser", "Réduire les imperfections", "Retrouver de l'éclat & Unifier"]
      },
      {
        question: "Comment sentez-vous votre peau au cours de la journée ?",
        options: ["Tiraillement / Sèche", "Brillance sur la zone T", "Sensible / Rougeurs"]
      },
      {
        question: "À quelle fréquence suivez-vous une routine beauté ?",
        options: ["Tous les jours avec soin", "De temps en temps", "J'aimerais être plus régulière !"]
      }
    ];

    let currentQuestion = 0;

    function showQuestion() {
      const q = questions[currentQuestion];
      document.getElementById('question-title').innerText = q.question;
      
      const optionsDiv = document.getElementById('options-container');
      optionsDiv.innerHTML = '';

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'quiz-option';
        btn.innerText = opt;
        btn.onclick = function() { nextQuestion(); };
        optionsDiv.appendChild(btn);
      });
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('results-screen').style.display = 'block';
      }
    }

    // Lancement au chargement de la page
    showQuestion();
  </script>

</body>
</html>
